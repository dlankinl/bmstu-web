events {
    worker_connections  1024;
}

http {
#     error_log /opt/homebrew/var/log/nginx/error.log debug;
    proxy_cache_path /Users/dmitry/Desktop/bmstu/7sem/bmstu-web/nginx/cache levels=1:2 keys_zone=all:64m inactive=2h max_size=2g use_temp_path=off;

     upstream balanced_backend {
        server localhost:8081 weight=2;
        server localhost:8083;
        server localhost:8084;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /opt/homebrew/var/log/nginx/access.log  main;

    server {
        listen 80;

        server_name bro_lets_find_bro_for_you;

        gzip_types text/plain text/css image/svg image/jpeg image/png image/svg+xml application/json;
        gzip on;

        proxy_cache all;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_cache_valid 200 10m;

        if ($request_uri ~ "^/api*") {
            set $no_cache 1;
        }
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;

        server_tokens off;
        add_header X-Server "$server_name";

        set $base_path /Users/dmitry/Desktop/bmstu/7sem/bmstu-web/nginx;
        root $base_path;

        location / {
            root $base_path/static;
        }

        location /documentation {
            add_header 'Content-Type' 'text/markdown; charset=utf-8';
            root /Users/dmitry/Desktop/bmstu/7sem/bmstu-web;
            index README.md;
            allow all;
        }

        location = /api/v2/ {
            proxy_pass http://localhost:3000/;
        }

        location /api/v1/ {
            if ( $request_method ~ ^(PATCH|POST)$ ) {
                proxy_pass http://localhost:8081;
            }
            if ( $request_method ~ ^(GET)$ ) {
                proxy_pass http://balanced_backend;
            }
        }

        location /api/v2/ {
            if ( $request_method ~ ^(PATCH|POST)$ ) {
                proxy_pass http://localhost:8081;
            }
            if ( $request_method ~ ^(GET)$ ) {
                proxy_pass http://balanced_backend;
            }
        }

        location /api/v2/swagger/ {
            proxy_pass http://localhost:3000/;
        }

        location /legacy/ {
            alias $base_path/legacy/;
        }

        location /test/ {
            proxy_pass http://localhost/;
        }

        location /admin/ {
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
            proxy_pass http://localhost:5050/;
            proxy_redirect off;
        }

        location = /status/ {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}