events {
    worker_connections  1024;
}

http {
    server {
        listen 80;

        location / {
            root /Users/dmitry/Desktop/bmstu/7sem/bmstu-web/nginx/static;
        }

        location /documentation {
            root /Users/dmitry/Desktop/bmstu/7sem/bmstu-web;
            index README.md;
            allow all;
        }

        location = /api/v2/ {
            proxy_pass http://localhost:3000/;
        }

        location /api/v2/ {
            proxy_pass http://localhost:8081/api/v2/;
        }

        location /api/v2/swagger {
            proxy_pass http://localhost:3000/;
        }

        location /legacy/ {
            proxy_pass http://localhost:8080/legacy/;
        }

        location ~* /api/v2/(.*)(\.(css|js|json|map|html|png|yaml)?$) {
            proxy_pass http://localhost:8081/$1$2;
        }

#         location /legacy {
#             proxy_pass http://localhost:8080;  # Forward requests to the frontend
# #             proxy_set_header Host http://localhost:8080;
#             proxy_set_header Host $host;
#
#
#             proxy_redirect $host http://localhost:8080/;
#         }

        location /test/ {
            proxy_pass http://localhost/;
        }

        location /admin/ {
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
            proxy_pass http://localhost:5050/;
            proxy_redirect off;
        }

        location = /status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}