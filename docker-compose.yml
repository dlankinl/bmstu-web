services:
  db:
    image: postgres:15
    container_name: "database"
    ports:
      - '5441:5432'
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:6.19
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@web.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    volumes:
      - ./pgadmin:/var/lib/pgadmin
    ports:
      - '5050:80'
  backend:
    image: ppo-backend:1.0.1
    container_name: "backend"
    ports:
      - '8081:8081'
      - '8082:8082'
    volumes:
      - ./backend/config.yml:/app/config.yml
      - ./backend/logs/:/app/logs/
    depends_on:
      - db
  frontend:
    image: ppo-frontend
    container_name: frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    environment:
      - API_URL=http://localhost:8081/api/v1
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - '3000:8080'
    environment:
      - SWAGGER_JSON=/mnt/swagger.json
    volumes:
      - /Users/dmitry/Desktop/bmstu/7sem/bmstu-web/backend/docs:/mnt

volumes:
  postgres-db:
    driver: local