services:
  db:
    image: postgres:15
    container_name: "database"
    ports:
      - '5441:5432'
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
  postgres-master:
    container_name: postgres-master
    image: bitnami/postgresql:16
    volumes:
      - ./postgres-db-master:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: postgres
      TZ: "Europe/Moscow"
    ports:
      - 5544:5432
  postgres-slave:
    container_name: postgres-slave
    image: bitnami/postgresql:16
    volumes:
      - ./postgres-db-slave:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      TZ: "Europe/Moscow"
    depends_on:
      postgres-master:
        condition: service_healthy
    ports:
      - 5545:5432
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:6.19
#    depends_on:
#      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@web.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    volumes:
      - ./pgadmin:/var/lib/pgadmin
    ports:
      - '5050:80'
  backend-1:
    image: ppo-backend:1.0.2
    container_name: "backend-1"
    ports:
      - '8081:8081'
    volumes:
      - ./backend/config.yml:/app/config.yml
      - ./backend/logs/backend-1/:/app/logs/
    depends_on:
      - postgres-master
  backend-2:
    image: ppo-backend:1.0.2
    container_name: "backend-2"
    ports:
      - '8083:8081'
    volumes:
      - ./backend/config-2.yml:/app/config.yml
      - ./backend/logs/backend-2/:/app/logs/
    depends_on:
      - postgres-slave
      - backend-1
  backend-3:
    image: ppo-backend:1.0.2
    container_name: "backend-3"
    ports:
      - '8084:8081'
    volumes:
      - ./backend/config-3.yml:/app/config.yml
      - ./backend/logs/backend-3/:/app/logs/
    depends_on:
      - postgres-slave
      - backend-1
  #  frontend:
#    image: ppo-frontend
#    container_name: frontend
#    ports:
#      - '8080:80'
#    depends_on:
#      - backend
#    environment:
#      - API_URL=http://localhost:8081/api/v1
  backend-single:
    image: ppo-backend:1.0.2
    container_name: "backend-single"
    ports:
      - '8085:8081'
    volumes:
      - ./backend/config-4.yml:/app/config.yml
      - ./backend/logs/backend-single/:/app/logs/
  backend-mirror:
    image: ppo-backend:1.0.2
    container_name: "backend-mirror"
    ports:
      - '8086:8081'
    volumes:
      - ./backend/config.yml:/app/config.yml
      - ./backend/logs/backend-mirror/:/app/logs/
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - '3000:8080'
    environment:
      - SWAGGER_JSON=/mnt/swagger.json
    volumes:
      - /Users/dmitry/Desktop/bmstu/7sem/bmstu-web/backend/docs:/mnt

volumes:
  postgres-db:
    driver: local